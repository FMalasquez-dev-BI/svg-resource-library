<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <style>
    :root {
      --tk-cyan: #25F4EE;
      --tk-red: #FE2C55;
      --tk-black: #000000;
    }

    svg {
      /* Pulso suave de todo el logo */
      animation: pulse-base 3s infinite ease-in-out alternate;
      cursor: pointer;
      overflow: visible;
    }

    .tk-layer {
      transform-origin: center;
      will-change: transform;
      /* Se retira mix-blend-mode: screen para que el negro sea visible en fondos claros */
    }

    /* Capa Inferior Izquierda (Cian) */
    .tk-cyan {
      fill: var(--tk-cyan);
      animation: glitch-cyan-soft 4s infinite linear alternate-reverse;
    }

    /* Capa Inferior Derecha (Rojo/Magenta) */
    .tk-red {
      fill: var(--tk-red);
      animation: glitch-red-soft 3.5s infinite linear alternate-reverse;
    }

    /* Capa Superior (Negro) */
    .tk-main {
      fill: var(--tk-black);
    }

    /* ==========================================
       EFECTO HOVER (Al pasar el cursor)
       ========================================== */
    svg:hover .tk-cyan {
      animation: glitch-cyan-hard 0.3s infinite linear alternate-reverse;
    }

    svg:hover .tk-red {
      animation: glitch-red-hard 0.25s infinite linear alternate-reverse;
    }

    svg:hover .tk-main {
      animation: glitch-main-hard 0.4s infinite linear alternate-reverse;
    }

    /* ==========================================
       KEYFRAMES (Lógica de animación)
       ========================================== */
    @keyframes pulse-base {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    /* Estado de reposo */
    @keyframes glitch-cyan-soft {
      0%, 20%, 40%, 60%, 80%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-0.5px, -0.2px); }
      30% { transform: translate(0.3px, 0.1px); }
      50% { transform: translate(-0.2px, 0.3px); }
      70% { transform: translate(0.4px, -0.3px); }
      90% { transform: translate(-0.3px, -0.4px); }
    }

    @keyframes glitch-red-soft {
      0%, 20%, 40%, 60%, 80%, 100% { transform: translate(0, 0); }
      15% { transform: translate(0.5px, 0.2px); }
      35% { transform: translate(-0.3px, -0.1px); }
      55% { transform: translate(0.2px, -0.3px); }
      75% { transform: translate(-0.4px, 0.3px); }
      95% { transform: translate(0.3px, 0.4px); }
    }

    /* Estado acelerado (Hover) */
    @keyframes glitch-cyan-hard {
      0% { transform: translate(0, 0); }
      20% { transform: translate(-1.5px, -1px); }
      40% { transform: translate(1px, 0.5px); }
      60% { transform: translate(-1px, 1.5px); }
      80% { transform: translate(1.5px, -1px); }
      100% { transform: translate(-0.5px, -1.5px); }
    }

    @keyframes glitch-red-hard {
      0% { transform: translate(0, 0); }
      20% { transform: translate(1.5px, 1px); }
      40% { transform: translate(-1px, -0.5px); }
      60% { transform: translate(1px, -1.5px); }
      80% { transform: translate(-1.5px, 1px); }
      100% { transform: translate(0.5px, 1.5px); }
    }

    @keyframes glitch-main-hard {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(0.5px, 0); }
      75% { transform: translate(-0.5px, 0); }
    }
  </style>

